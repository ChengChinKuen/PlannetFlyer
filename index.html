function drawUI() {
  ctx.fillStyle = 'rgba(10, 20, 45, 0.65)';
  ctx.strokeStyle = 'rgba(126, 232, 250, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(PANEL_X, BEST_Y, PANEL_W, BEST_H, 10);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#7ee8fa';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('BEST', PANEL_X + 15, BEST_Y + 25);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px Arial';
  ctx.fillText(best + ' m', PANEL_X + 15, BEST_Y + 55);

  ctx.fillStyle = 'rgba(10, 20, 45, 0.65)';
  ctx.strokeStyle = 'rgba(180, 140, 255, 0.5)';
  ctx.beginPath();
  ctx.roundRect(PANEL_X, PILOT_Y, PANEL_W, PILOT_H, 10);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#c8a8ff';
  ctx.font = 'bold 12px Arial';
  ctx.fillText('PILOT', PANEL_X + 15, PILOT_Y + 22);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px Arial';
  ctx.fillText(CHARACTERS[selectedCharacter].name, PANEL_X + 15, PILOT_Y + 44);

  const anyPickup =
    minesHit > 0 || ufosUsed > 0 || jetpacksUsed > 0 ||
    rocketsUsed > 0 || antigravUsed > 0 ||
    blackholesUsed > 0 || whiteholesUsed > 0;

  if (state !== 'aiming' && anyPickup) {
    const rows = [];
    if (minesHit > 0)       rows.push(['💥 Mines',       '#ff6b6b', minesHit]);
    if (ufosUsed > 0)       rows.push(['🛸 UFOs',        '#7ee8fa', ufosUsed]);
    if (jetpacksUsed > 0)   rows.push(['🚀 Jetpacks',    '#ffb84d', jetpacksUsed]);
    if (rocketsUsed > 0)    rows.push(['🚀 Rockets',     '#ff9c4a', rocketsUsed]);
    if (antigravUsed > 0)   rows.push(['⬆ Anti-Grav',    '#c8a8ff', antigravUsed]);
    if (blackholesUsed > 0) rows.push(['⚫ Black Holes', '#a070ff', blackholesUsed]);
    if (whiteholesUsed > 0) rows.push(['⚪ White Holes', '#a0f0ff', whiteholesUsed]);
    const rowH = 22;
    const panelH = 28 + rows.length * rowH;
    ctx.fillStyle = 'rgba(10, 20, 45, 0.7)';
    ctx.strokeStyle = 'rgba(180, 140, 255, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(PANEL_X, STATS_Y, PANEL_W, panelH, 10);
    ctx.fill();
    ctx.stroke();
    let y = STATS_Y + 20;
    rows.forEach(([label, color, value]) => {
      ctx.font = 'bold 12px Arial';
      ctx.textAlign = 'left';
      ctx.fillStyle = color;
      ctx.fillText(label, PANEL_X + 12, y);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.fillText(value + '', PANEL_X + PANEL_W - 30, y);
      y += rowH;
    });
  }

  if (state === 'flying' && (ufoTranslateTime > 0 || jetpackBoostTime > 0 || rocketBoostTime > 0)) {
    const bw = 240;
    const bh = 52;
    const bx = W / 2 - bw / 2;
    const by = 96;
    ctx.fillStyle = 'rgba(10, 20, 45, 0.75)';
    ctx.strokeStyle = 'rgba(255, 200, 100, 0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 10);
    ctx.fill();
    ctx.stroke();
    ctx.textAlign = 'center';
    const activeList = [];
    if (ufoTranslateTime > 0)  activeList.push(['🛸 TRANSLATE',  '#7ee8fa', ufoTranslateTime]);
    if (jetpackBoostTime > 0)  activeList.push(['🚀 JETPACK',    '#ffb84d', jetpackBoostTime]);
    if (rocketBoostTime > 0)   activeList.push(['🚀 ROCKET',     '#ff9c4a', rocketBoostTime]);
    if (activeList.length > 0) {
      const [label, color, t] = activeList[0];
      ctx.fillStyle = color;
      ctx.font = 'bold 12px Arial';
      ctx.fillText(label, W/2, by + 20);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 18px Arial';
      ctx.fillText(t.toFixed(1) + ' s', W/2, by + 42);
      if (activeList.length > 1) {
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'right';
        ctx.fillText('+' + (activeList.length - 1), bx + bw - 8, by + 14);
      }
    }
  }

  if (state === 'flying') {
    const speed = Math.hypot(player.vx, player.vy);
    const altitude = Math.max(0, Math.round((GROUND_Y - player.y) * METER_SCALE));
    const liveDistance = Math.max(0, Math.round((player.x - slingshot.x) * METER_SCALE));
    const hudW = 320;
    const hudH = 60;
    const hudX = W / 2 - hudW / 2;
    const hudY = 20;
    ctx.fillStyle = 'rgba(10, 20, 45, 0.7)';
    ctx.strokeStyle = 'rgba(126, 232, 250, 0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(hudX, hudY, hudW, hudH, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ff6b6b';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('SPEED', hudX + 60, hudY + 20);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText(speed.toFixed(1), hudX + 60, hudY + 44);
    ctx.fillStyle = '#7ee8fa';
    ctx.font = 'bold 11px Arial';
    ctx.fillText('DISTANCE', hudX + hudW / 2, hudY + 20);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText(liveDistance + ' m', hudX + hudW / 2, hudY + 44);
    ctx.fillStyle = '#a0f0c0';
    ctx.font = 'bold 11px Arial';
    ctx.fillText('ALTITUDE', hudX + hudW - 60, hudY + 20);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText(altitude + ' m', hudX + hudW - 60, hudY + 44);
  }

  if (state === 'aiming') {
    const hintW = 620;
    const hintH = 34;
    const hintX = W / 2 - hintW / 2;
    const hintY = H - 44;

    let hintText = '';
    const launcher = LAUNCHERS[selectedLauncher].id;
    if (launcher === 'slingshot') {
      hintText = '✦ Drag the slingshot & release to launch ✦';
    } else if (launcher === 'cannon') {
      hintText = '✦ Drag to aim the cannon, release to fire ✦';
    }

    ctx.fillStyle = 'rgba(10, 20, 45, 0.75)';
    ctx.strokeStyle = 'rgba(126, 232, 250, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(hintX, hintY, hintW, hintH, 8);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#7ee8fa';
    ctx.textAlign = 'center';
    ctx.font = 'bold 14px Arial';
    ctx.fillText(hintText, W/2, hintY + 22);
  }

  if (state === 'landed') {
    const stats = [];
    if (minesHit > 0)       stats.push(['💥 ' + minesHit + ' mines hit',           '#ff6b6b']);
    if (ufosUsed > 0)       stats.push(['🛸 ' + ufosUsed + ' UFO translations',    '#7ee8fa']);
    if (jetpacksUsed > 0)   stats.push(['🚀 ' + jetpacksUsed + ' jetpack boosts',  '#ffb84d']);
    if (rocketsUsed > 0)    stats.push(['🚀 ' + rocketsUsed + ' rockets used',     '#ff9c4a']);
    if (antigravUsed > 0)   stats.push(['⬆ ' + antigravUsed + ' anti-grav zones',  '#c8a8ff']);
    if (blackholesUsed > 0) stats.push(['⚫ ' + blackholesUsed + ' black holes',   '#a070ff']);
    if (whiteholesUsed > 0) stats.push(['⚪ ' + whiteholesUsed + ' white holes',   '#a0f0ff']);

    const baseH = 190;
    const rowH = 20;
    const panelW = 400;
    const panelH = baseH + stats.length * rowH;
    const panelX = W/2 - panelW/2;
    const panelY = H/2 - panelH/2;

    ctx.fillStyle = 'rgba(5, 8, 25, 0.88)';
    ctx.strokeStyle = 'rgba(126, 232, 250, 0.7)';
    ctx.lineWidth = 2;
    if (QP.useShadow) {
      ctx.shadowColor = 'rgba(126, 232, 250, 0.7)';
      ctx.shadowBlur = 20;
    }
    ctx.beginPath();
    ctx.roundRect(panelX, panelY, panelW, panelH, 16);
    ctx.fill();
    ctx.stroke();
    clearShadow();

    ctx.fillStyle = '#7ee8fa';
    ctx.textAlign = 'center';
    ctx.font = 'bold 34px Arial';
    ctx.fillText('LANDED', W/2, panelY + 45);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px Arial';
    ctx.fillText(score + ' m', W/2, panelY + 85);

    ctx.fillStyle = '#a0c8ff';
    ctx.font = 'bold 13px Arial';
    ctx.fillText('Pilot: ' + CHARACTERS[selectedCharacter].name, W/2, panelY + 110);

    ctx.font = 'bold 13px Arial';
    let y = panelY + 138;
    stats.forEach(([text, color]) => {
      ctx.fillStyle = color;
      ctx.fillText(text, W/2, y);
      y += rowH;
    });

    ctx.fillStyle = '#8ba8c9';
    ctx.font = '13px Arial';
    ctx.fillText('Click anywhere to choose a new pilot', W/2, panelY + panelH - 14);
  }
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

// ============================================================
//   AUTO PERFORMANCE DETECTION
// ============================================================
function autoDetectPerformance(now) {
  if (autoDetectDone || qualityMode !== 'auto') return;

  if (detectFrames > 0) {
    const delta = now - lastTimestamp;
    if (delta > 0) fpsSamples.push(1000 / delta);
  }
  detectFrames++;

  if (detectFrames >= 120) {
    const warm = fpsSamples.slice(30);
    const avg = warm.reduce((a,b) => a+b, 0) / (warm.length || 1);
    console.log('[Planet Flyer] Auto-detect avg FPS:', avg.toFixed(1));

    if (avg < 45) {
      lowQuality = true;
      applyQualityMode();
      console.log('[Planet Flyer] Low quality mode enabled');
    } else {
      lowQuality = false;
      applyQualityMode();
    }
    autoDetectDone = true;
  }
}

// ============================================================
//   MAIN LOOP
// ============================================================
function loop(timestamp) {
  if (!lastTimestamp) lastTimestamp = timestamp;
  dt = (timestamp - lastTimestamp) / 1000;
  lastTimestamp = timestamp;
  if (dt > 0.1) dt = 0.1;

  if (choosingCharacter) {
    autoDetectPerformance(timestamp);
  }

  update();

  const dpr = canvas._dpr || 1;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(viewOffsetX, viewOffsetY);
  ctx.scale(viewScale, viewScale);

  ctx.beginPath();
  ctx.rect(0, 0, W, H);
  ctx.clip();

  drawSky();
  drawStars();
  drawPlanets();
  drawDust();
  drawHills();
  drawGround();
  drawMines();
  drawSigns();
  drawItems();

  drawLauncher();

  drawTrail();
  drawAimGuide();
  if (state !== 'landed' && !choosingCharacter) {
    if (state === 'flying') {
      drawPlayer();
    } else if (LAUNCHERS[selectedLauncher].id === 'slingshot') {
      drawPlayer();
    }
  }
  if (attachedUFO && state === 'flying') drawAttachedUFO();
  drawParticles();

  if (choosingCharacter) {
    drawCharacterSelect();
  } else {
    drawUI();
  }

  ctx.restore();

  requestAnimationFrame(loop);
}
