<head>
<meta charset="UTF-8">
<title>Planet Flyer — Space</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;

    height: 100%;

    display: block;
    position: absolute;

    left: 0;

    z-index: 10;
    background: rgba(10, 20, 45, 0.85);
    color: #7ee8fa;
    border: 1.5px solid rgba(126, 232, 250, 0.6);
    border-radius: 10px;
    padding: 10px 16px;
    font: bold 14px Arial, sans-serif;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(126, 232, 250, 0.35);
    transition: all 0.2s;
  }
  #musicBtn { right: 16px; }
  #qualityBtn { right: 150px; }
  #musicBtn:hover, #qualityBtn:hover {
    background: rgba(20, 40, 80, 0.95);
    box-shadow: 0 0 30px rgba(126, 232, 250, 0.6);
  }
  #musicBtn.muted {
    color: #666;
    border-color: #444;
    box-shadow: none;
  }
  #qualityBtn.low {
    color: #ffb84d;
    border-color: rgba(255, 184, 77, 0.6);
  }
</style>
</head>

const ctx = canvas.getContext('2d');

//   PERFORMANCE MODE SYSTEM
// ============================================================
let qualityMode = 'auto';
let lowQuality = false;
let fpsSamples = [];
let autoDetectDone = false;
let detectFrames = 0;

function getQualityParams() {
  return lowQuality ? {
    dprCap: 1.0,
    starCount: 120,
    dustCount: 60,
    hillCount: 10,
    useShadow: false,
    particleShadow: false,
    itemShadow: false,
    charShadow: false,
    particleCap: 120,
    maxParticles: 180,
    trailMax: 80,
  } : {
    dprCap: 1.5,
    starCount: 400,
    dustCount: 200,
    hillCount: 18,
    useShadow: true,
    particleShadow: true,
    itemShadow: true,
    charShadow: true,
    particleCap: 9999,
    maxParticles: 9999,
    trailMax: 150,
  };
}

let QP = getQualityParams();

function setShadow(color, blur) {
  if (QP.useShadow) {
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
  }
}
function clearShadow() {
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
}

function tryPushParticle(p) {
  if (particles.length < QP.maxParticles) {
    particles.push(p);
  }
}

// ============================================================
//   RESPONSIVE CANVAS
// ============================================================
const DESIGN_W = 900;
const DESIGN_H = 500;
let W = DESIGN_W;
let H = DESIGN_H;

let viewScale = 1;
let viewOffsetX = 0;
let viewOffsetY = 0;

function resizeCanvas() {
  const cssW = window.innerWidth;
  const cssH = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, QP.dprCap);

  canvas.width  = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);

  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';

  const scaleX = cssW / DESIGN_W;
  const scaleY = cssH / DESIGN_H;
  viewScale = Math.min(scaleX, scaleY);

  viewOffsetX = (cssW - DESIGN_W * viewScale) / 2;
  viewOffsetY = (cssH - DESIGN_H * viewScale) / 2;

  canvas._dpr = dpr;
}

window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
resizeCanvas();

// ============================================================
//   SPACE MAMBO — original procedural music
// ============================================================
let audioCtx = null;
let mamboMaster = null;
let mamboTimer = null;
let mamboPlaying = false;
let mamboMuted = false;
let currentStep = 0;

const NOTE = {
  A2: 110.00, C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00,
  A3: 220.00, C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00,
  A4: 440.00, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99,
};

const BARS = [
  {
    bass: ['A2','·','·','A2','·','·','A2','·','·','A2','·','·','E3','·','A2','·'],
    chord: [220.00, 261.63, 329.63],
    pad:   [110.00, 220.00, 261.63, 329.63],
  },
  {
    bass: ['D3','·','·','D3','·','·','D3','·','·','D3','·','·','A2','·','D3','·'],
    chord: [293.66, 349.23, 440.00],
    pad:   [146.83, 293.66, 349.23, 440.00],
  },
  {
    bass: ['G3','·','·','G3','·','·','G3','·','·','G3','·','·','D3','·','G3','·'],
    chord: [196.00, 246.94, 293.66],
    pad:   [98.00, 196.00, 246.94, 293.66],
  },
  {
    bass: ['C3','·','·','C3','·','·','C3','·','·','C3','·','·','G3','·','A2','·'],
    chord: [261.63, 329.63, 392.00],
    pad:   [130.81, 261.63, 329.63, 392.00],
  },
];

const KICK_STEPS = [0, 6, 10];
const SNARE_STEPS = [4, 12];
const HAT_STEPS = [1, 3, 5, 7, 9, 11, 13, 15];
const CONGA_STEPS = [3, 7, 11, 14];
const STAB_STEPS = [3, 7, 11, 15];

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  mamboMaster = audioCtx.createGain();
  mamboMaster.gain.value = 0.28;
  mamboMaster.connect(audioCtx.destination);
}

function playBass(freq, time, dur) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  osc.frequency.setValueAtTime(freq * 1.02, time);
  osc.frequency.exponentialRampToValueAtTime(freq, time + 0.06);
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(0.35, time + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
  osc.connect(gain).connect(mamboMaster);
  osc.start(time);
  osc.stop(time + dur + 0.05);
}

function playStab(freqs, time) {
  freqs.forEach(f => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = f;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.setValueAtTime(2200, time);
    filt.frequency.exponentialRampToValueAtTime(700, time + 0.18);
    filt.Q.value = 4;
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(0.09 / freqs.length, time + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.22);
    osc.connect(filt).connect(gain).connect(mamboMaster);
    osc.start(time);
    osc.stop(time + 0.25);
  });
}

function playPad(freqs, time, dur) {
  freqs.forEach((f, i) => {
    for (let detune of [-7, 7]) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = i === 0 ? 'sine' : 'triangle';
      osc.frequency.value = f;
      osc.detune.value = detune;
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(0.03 / freqs.length, time + 1.2);
      gain.gain.linearRampToValueAtTime(0.025 / freqs.length, time + dur * 0.7);
      gain.gain.linearRampToValueAtTime(0, time + dur);
      osc.connect(gain).connect(mamboMaster);
      osc.start(time);
      osc.stop(time + dur + 0.1);
    }
  });
}

function playKick(time) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(140, time);
  osc.frequency.exponentialRampToValueAtTime(45, time + 0.12);
  gain.gain.setValueAtTime(0.6, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.22);
  osc.connect(gain).connect(mamboMaster);
  osc.start(time);
  osc.stop(time + 0.24);
}

function playSnare(time) {
  const dur = 0.12;
  const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.value = 1800;
  filt.Q.value = 0.8;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.18;
  src.connect(filt).connect(gain).connect(mamboMaster);
  src.start(time);
}

function playHat(time) {
  const dur = 0.05;
  const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 5);
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'highpass';
  filt.frequency.value = 7000;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.08;
  src.connect(filt).connect(gain).connect(mamboMaster);
  src.start(time);
}

function playConga(time) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(420, time);
  osc.frequency.exponentialRampToValueAtTime(180, time + 0.08);
  gain.gain.setValueAtTime(0.22, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.14);
  osc.connect(gain).connect(mamboMaster);
  osc.start(time);
  osc.stop(time + 0.16);
}

const STEP_TIME = 0.12;
let nextStepTime = 0;
const LOOKAHEAD = 0.1;

function scheduleStep(step, time) {
  const barIndex = Math.floor(step / 16) % BARS.length;
  const stepInBar = step % 16;
  const bar = BARS[barIndex];

  const bassNote = bar.bass[stepInBar];
  if (bassNote && NOTE[bassNote]) {
    playBass(NOTE[bassNote], time, 0.16);
  }

  if (STAB_STEPS.includes(stepInBar)) {
    playStab(bar.chord, time);
  }

  if (KICK_STEPS.includes(stepInBar))  playKick(time);
  if (SNARE_STEPS.includes(stepInBar)) playSnare(time);
  if (HAT_STEPS.includes(stepInBar))   playHat(time);
  if (CONGA_STEPS.includes(stepInBar)) playConga(time);

  if (stepInBar === 0) {
    playPad(bar.pad, time, STEP_TIME * 16 * 0.98);
  }
}

function mamboTick() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  while (nextStepTime < now + LOOKAHEAD) {
    if (nextStepTime < now) nextStepTime = now;
    scheduleStep(currentStep, nextStepTime);
    currentStep = (currentStep + 1) % (16 * BARS.length);
    nextStepTime += STEP_TIME;
  }
}

function startMambo() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (mamboPlaying) return;
  mamboPlaying = true;
  currentStep = 0;
  nextStepTime = audioCtx.currentTime + 0.1;
  mamboTimer = setInterval(mamboTick, lowQuality ? 40 : 25);
}

function stopMambo() {
  if (mamboTimer) { clearInterval(mamboTimer); mamboTimer = null; }
  if (audioCtx && mamboMaster) {
    const t = audioCtx.currentTime;
    mamboMaster.gain.cancelScheduledValues(t);
    mamboMaster.gain.setValueAtTime(mamboMaster.gain.value, t);
    mamboMaster.gain.linearRampToValueAtTime(0, t + 0.5);
    setTimeout(() => { if (mamboMaster) mamboMaster.gain.value = 0.28; }, 600);
  }
  mamboPlaying = false;
}

const musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  mamboMuted = !mamboMuted;
  if (mamboMuted) {
    stopMambo();
    musicBtn.textContent = '🔇 Music: OFF';
    musicBtn.classList.add('muted');
  } else {
    startMambo();
    musicBtn.textContent = '🎵 Music: ON';
    musicBtn.classList.remove('muted');
  }
});
document.addEventListener('click', function firstClick() {
  if (!mamboMuted) startMambo();
  document.removeEventListener('click', firstClick);
}, { once: true });

// ============================================================
//   QUALITY BUTTON
// ============================================================
const qualityBtn = document.getElementById('qualityBtn');
function applyQualityMode() {
  QP = getQualityParams();

  if (qualityMode === 'auto') {
    qualityBtn.textContent = '⚡ Quality: AUTO' + (lowQuality ? ' (Low)' : ' (High)');
    qualityBtn.classList.toggle('low', lowQuality);
  } else if (qualityMode === 'low') {
    qualityBtn.textContent = '⚡ Quality: LOW';
    qualityBtn.classList.add('low');
  } else {
    qualityBtn.textContent = '⚡ Quality: HIGH';
    qualityBtn.classList.remove('low');
  }

  rebuildSceneArrays();
  resizeCanvas();
}

qualityBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (qualityMode === 'auto')      qualityMode = 'low';
  else if (qualityMode === 'low')  qualityMode = 'high';
  else                             qualityMode = 'auto';

  if (qualityMode === 'auto') {
    autoDetectDone = false;
    detectFrames = 0;
    fpsSamples = [];
    lowQuality = false;
  } else {
    lowQuality = (qualityMode === 'low');
  }

  applyQualityMode();
});

function ensureMinesUpTo(worldX) {
  while (minesScannedUpTo < worldX) {
    minesScannedUpTo += MINE_SCAN_STEP;
    if (Math.random() < MINE_CHANCE) {
      const jitter = (Math.random() - 0.5) * MINE_SCAN_STEP * 1.4;
      mines.push({
        x: minesScannedUpTo + jitter,
        exploded: false,
        wobble: Math.random() * Math.PI * 2,
        blink: Math.random() * Math.PI * 2
      });
    }
  }
}

function ensureItemsUpTo(worldX) {
  while (itemsScannedUpTo < worldX) {
    itemsScannedUpTo += ITEM_SCAN_STEP;
    if (Math.random() < ITEM_SPAWN_CHANCE) {
      const jitter = (Math.random() - 0.5) * ITEM_SCAN_STEP * 1.4;
      const altWorld = ITEM_MIN_ALT_WORLD
        + Math.random() * (ITEM_MAX_ALT_WORLD - ITEM_MIN_ALT_WORLD);
      const yWorld = GROUND_Y - altWorld;

      const r = Math.random();
      let type;
      if      (r < T_UFO)                                     type = 'ufo';
      else if (r < T_UFO + T_JETPACK)                         type = 'jetpack';
      else if (r < T_UFO + T_JETPACK + T_ROCKET)              type = 'rocket';
      else if (r < T_UFO + T_JETPACK + T_ROCKET + T_ANTIGRAV) type = 'antigrav';
      else if (r < T_UFO + T_JETPACK + T_ROCKET + T_ANTIGRAV + T_BLACKHOLE) type = 'blackhole';
      else                                                    type = 'whitehole';

      let radius;
      if      (type === 'ufo')        radius = UFO_COLLISION_RADIUS;
      else if (type === 'jetpack')    radius = JETPACK_COLLISION_RADIUS;
      else if (type === 'rocket')     radius = ROCKET_COLLISION_RADIUS;
      else if (type === 'blackhole')  radius = BLACKHOLE_COLLISION_RADIUS;
      else if (type === 'whitehole')  radius = WHITEHOLE_COLLISION_RADIUS;
      else                            radius = ANTIGRAV_RADIUS;

      items.push({
        type,
        x: itemsScannedUpTo + jitter,
        y: yWorld,
        radius,
        used: false,
        phase: Math.random() * Math.PI * 2
      });
    }
  }
}

function cleanupMines() {
  const cutoff = camera.x - 500;
  if (mines.length > 200) mines = mines.filter(m => m.x > cutoff);
}
function cleanupItems() {
  const cutoff = camera.x - 600;
  if (items.length > 200) items = items.filter(it => it.x > cutoff);
}

function rebuildSceneArrays() {
  stars = [];
  const n = QP.starCount;
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W * 6,
      y: Math.random() * H * 6 - H * 3,
      size: Math.random() * 1.8 + 0.3,
      depth: 0.1 + Math.random() * 0.9,
      twinkle: Math.random() * Math.PI * 2
    });
  }

  dust = [];
  const d = QP.dustCount;
  for (let i = 0; i < d; i++) {
    dust.push({
      x: Math.random() * W * 6,
      y: Math.random() * H * 6 - H * 3,
      s: Math.random() * 0.6 + 0.2,
      speed: 0.05 + Math.random() * 0.15,
      color: `hsla(${200 + Math.random()*80}, 80%, 70%, ${0.2 + Math.random()*0.4})`
    });
  }

  hills = [];
  const h = QP.hillCount;
  hillSpan = W * 2.4;
  for (let i = 0; i < h; i++) {
    hills.push({
      x: i * (hillSpan / h) + Math.random() * 40,
      r: 90 + Math.random() * 70,
      color: `hsl(${260 + Math.random()*40}, 40%, ${15 + Math.random()*10}%)`
    });
  }
}

let skyGradCache = null;
let skyGradCacheH = 0;

function getSkyGradient() {
  if (!skyGradCache || skyGradCacheH !== H) {
    skyGradCache = ctx.createLinearGradient(0, 0, 0, H);
    skyGradCache.addColorStop(0, '#050518');
    skyGradCache.addColorStop(0.5, '#0d0d2b');
    skyGradCache.addColorStop(1, '#1a0a2e');
    skyGradCacheH = H;
  }
  return skyGradCache;
}

let neb1Cache = null, neb1CacheKey = '';
let neb2Cache = null, neb2CacheKey = '';

// ============================================================
//   SELECT CARD RECT
// ============================================================
function getLauncherCardRect(i) {
  const cardW = 220;
  const cardH = 120;
  const gap = 40;
  const totalW = cardW * 2 + gap;
  const startX = (W - totalW) / 2;
  const y = 125;
  return { x: startX + i * (cardW + gap), y, w: cardW, h: cardH };
}

function getCardRect(i) {
  const cardW = 200;
  const cardH = 170;
  const gap = 30;
  const totalW = cardW * 3 + gap * 2;
  const startX = (W - totalW) / 2;
  const y = 290;
  return { x: startX + i * (cardW + gap), y, w: cardW, h: cardH };
}

// ============================================================
//   INPUT
// ============================================================
function getMouse(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;

  const cssX = (t.clientX - rect.left);
  const cssY = (t.clientY - rect.top);

  const x = (cssX - viewOffsetX) / viewScale;
  const y = (cssY - viewOffsetY) / viewScale;

  return { x, y };
}
function pointInRect(m, r) {
  return m.x >= r.x && m.x <= r.x + r.w && m.y >= r.y && m.y <= r.y + r.h;
}

function onDown(e) {
  e.preventDefault();

  if (choosingCharacter) {
    const m = getMouse(e);

    for (let i = 0; i < LAUNCHERS.length; i++) {
      if (pointInRect(m, getLauncherCardRect(i))) {
        selectedLauncher = i;
        return;
      }
    }

    for (let i = 0; i < CHARACTERS.length; i++) {
      if (pointInRect(m, getCardRect(i))) {
        selectedCharacter = i;
        choosingCharacter = false;
        reset();
        return;
      }
    }
    return;
  }

  if (state === 'aiming') {
    const m = getMouse(e);
    const launcher = LAUNCHERS[selectedLauncher].id;

    if (launcher === 'slingshot') {
      dragging = true;
      dragX = m.x; dragY = m.y;
    } else if (launcher === 'cannon') {
      dragging = true;
      updateCannonAngle(m);
    }
  } else if (state === 'landed') {
    choosingCharacter = true;
  }
}

function updateCannonAngle(m) {
  const dx = m.x - slingshot.x;
  const dy = m.y - slingshot.y;
  let ang = Math.atan2(-dy, dx) * 180 / Math.PI;
  if (ang < CANNON_ANGLE_MIN) ang = CANNON_ANGLE_MIN;
  if (ang > CANNON_ANGLE_MAX) ang = CANNON_ANGLE_MAX;
  cannonAngleDeg = ang;
}

function onMove(e) {
  const m = getMouse(e);
  if (choosingCharacter) {
    hoverIndex = -1;
    hoverLauncherIndex = -1;
    for (let i = 0; i < CHARACTERS.length; i++) {
      if (pointInRect(m, getCardRect(i))) { hoverIndex = i; break; }
    }
    for (let i = 0; i < LAUNCHERS.length; i++) {
      if (pointInRect(m, getLauncherCardRect(i))) { hoverLauncherIndex = i; break; }
    }
    return;
  }

  if (!dragging) return;
  e.preventDefault();

  const launcher = LAUNCHERS[selectedLauncher].id;

  if (launcher === 'slingshot') {
    let dx = m.x - slingshot.x;
    let dy = m.y - slingshot.y;
    const dist = Math.hypot(dx, dy);
    if (dist > MAX_DRAG) {
      dx = (dx / dist) * MAX_DRAG;
      dy = (dy / dist) * MAX_DRAG;
    }
    dragX = slingshot.x + dx;
    dragY = slingshot.y + dy;
    player.x = dragX;
    player.y = dragY;
  } else if (launcher === 'cannon') {
    updateCannonAngle(m);
  }
}

function onUp(e) {
  if (choosingCharacter) return;
  if (state !== 'aiming') return;

  const launcher = LAUNCHERS[selectedLauncher].id;

  if (launcher === 'slingshot') {
    if (!dragging) return;
    e.preventDefault();
    dragging = false;

    const dx = slingshot.x - dragX;
    const dy = slingshot.y - dragY;
    const power = Math.hypot(dx, dy);

    if (power < 12) {
      player.x = slingshot.x;
      player.y = slingshot.y;
      return;
    }

    const speed = power * 0.28;
    const angle = Math.atan2(dy, dx);
    launchPlayer(Math.cos(angle) * speed, Math.sin(angle) * speed);

  } else if (launcher === 'cannon') {
    if (!dragging) return;
    e.preventDefault();
    dragging = false;
    const rad = cannonAngleDeg * Math.PI / 180;
    launchPlayer(Math.cos(rad) * CANNON_POWER, -Math.sin(rad) * CANNON_POWER);
  }
}

function launchPlayer(vx, vy) {
  player.vx = vx;
  player.vy = vy;
  player.spin = (Math.random() - 0.5) * 0.15 + player.vx * 0.005;
  player.x = slingshot.x;
  player.y = slingshot.y;
  player.settled = false;
  player.bounces = 0;
  flightFrames = 0;
  trail = [];
  ufoTranslateTime = 0;
  jetpackBoostTime = 0;
  rocketBoostTime = 0;
  attachedUFO = null;
  state = 'flying';
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onUp, { passive: false });

// ============================================================
//   RESET
// ============================================================
function reset() {
  state = 'aiming';
  player.x = slingshot.x;
  player.y = slingshot.y;
  player.vx = 0;
  player.vy = 0;
  player.angle = 0;
  player.spin = 0;
  player.settled = false;
  player.bounces = 0;
  dragX = slingshot.x;
  dragY = slingshot.y;
  camera.x = 0;
  camera.y = 0;
  trail = [];
  particles = [];
  flightFrames = 0;
  landingX = 0;
  minesHit = 0;
  ufosUsed = 0;
  jetpacksUsed = 0;
  rocketsUsed = 0;
  antigravUsed = 0;
  blackholesUsed = 0;
  whiteholesUsed = 0;
  ufoTranslateTime = 0;
  jetpackBoostTime = 0;
  rocketBoostTime = 0;
  attachedUFO = null;
  mines = [];
  items = [];
  minesScannedUpTo = MIN_MINE_X;
  itemsScannedUpTo = MIN_ITEM_X;
  cannonAngleDeg = CANNON_ANGLE_DEFAULT;
}

// ============================================================
//   UPDATE
// ============================================================
function update() {
  if (choosingCharacter) return;

  if (state === 'flying') {
    flightFrames++;
    const step = dt * 60;

    const ufoActive = ufoTranslateTime > 0;
    if (!ufoActive) {
      player.vy += GRAVITY * step;
    } else {
      player.vy = 0;
    }

    let inAntigrav = false;
    for (const it of items) {
      if (it.type !== 'antigrav') continue;
      const dx = player.x - it.x;
      const dy = player.y - it.y;
      if (Math.hypot(dx, dy) < it.radius + player.radius) {
        inAntigrav = true;
        break;
      }
    }
    if (inAntigrav && !ufoActive) {
      player.vy += ANTIGRAV_LIFT * step;
    }

    if (ufoActive) {
      player.x += UFO_TRANSLATE_SPEED * step;
      player.vx = UFO_TRANSLATE_SPEED;
      ufoTranslateTime -= dt;
      if (ufoTranslateTime < 0) ufoTranslateTime = 0;
      if (flightFrames % 2 === 0) {
        tryPushParticle({
          x: player.x - 18 + (Math.random() - 0.5) * 10,
          y: player.y + (Math.random() - 0.5) * 10,
          vx: -2 - Math.random() * 2,
          vy: (Math.random() - 0.5) * 2,
          life: 18,
          size: 2 + Math.random() * 2,
          color: `hsla(${180 + Math.random() * 40}, 100%, 70%, 0.9)`
        });
      }
      if (attachedUFO) attachedUFO.phase += 0.05;
      if (ufoTranslateTime === 0) attachedUFO = null;
    }

    if (jetpackBoostTime > 0) {
      player.vx += JETPACK_BOOST_ACCEL * step;
      if (player.vx > JETPACK_BOOST_MAX_VX) player.vx = JETPACK_BOOST_MAX_VX;
      jetpackBoostTime -= dt;
      if (jetpackBoostTime < 0) jetpackBoostTime = 0;
      const backX = -22;
      for (let i = 0; i < 2; i++) {
        tryPushParticle({
          x: player.x + backX + (Math.random() - 0.5) * 6,
          y: player.y + (Math.random() - 0.5) * 8,
          vx: backX * 0.2 + (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 3 + 1,
          life: 20,
          size: 3 + Math.random() * 3,
          color: `hsl(${25 + Math.random() * 30}, 100%, ${60 + Math.random() * 25}%)`
        });
      }
    }

    if (rocketBoostTime > 0) {
      player.vx += ROCKET_ACCEL_X * step;
      if (!ufoActive) {
        player.vy += ROCKET_ACCEL_Y * step;
      }
      if (player.vx > ROCKET_MAX_VX) player.vx = ROCKET_MAX_VX;
      if (player.vy < ROCKET_MAX_VY_UP) player.vy = ROCKET_MAX_VY_UP;
      rocketBoostTime -= dt;
      if (rocketBoostTime < 0) rocketBoostTime = 0;
      const backX = -Math.cos(ROCKET_ANGLE_RAD) * 22;
      const backY = Math.sin(ROCKET_ANGLE_RAD) * 22;
      for (let i = 0; i < 2; i++) {
        tryPushParticle({
          x: player.x + backX + (Math.random() - 0.5) * 6,
          y: player.y + backY + (Math.random() - 0.5) * 6,
          vx: backX * 0.15 + (Math.random() - 0.5) * 2,
          vy: backY * 0.15 + (Math.random() - 0.5) * 2 + 1,
          life: 22,
          size: 3 + Math.random() * 4,
          color: `hsl(${15 + Math.random() * 35}, 100%, ${55 + Math.random() * 30}%)`
        });
      }
    }

    player.vx *= Math.pow(FRICTION, step);
    player.x += player.vx * step;
    if (ufoActive) {
      player.vy = 0;
    } else {
      player.y += player.vy * step;
    }
    player.angle += player.spin * step;

    trail.push({ x: player.x, y: player.y, life: 45 });
    if (trail.length > QP.trailMax) trail.shift();

    ensureMinesUpTo(player.x + W);
    ensureItemsUpTo(player.x + W);
    cleanupMines();
    cleanupItems();

    for (const m of mines) {
      if (m.exploded) continue;
      const dx = player.x - m.x;
      const dy = player.y - GROUND_Y;
      const dist = Math.hypot(dx, dy);
      if (dist < player.radius + MINE_RADIUS) explodeMine(m);
    }

    for (const it of items) {
      if (it.used) continue;
      const dx = player.x - it.x;
      const dy = player.y - it.y;
      const dist = Math.hypot(dx, dy);
      if (dist < it.radius + player.radius) {
        if      (it.type === 'ufo')        collectUFO(it);
        else if (it.type === 'jetpack')    collectJetpack(it);
        else if (it.type === 'rocket')     collectRocket(it);
        else if (it.type === 'blackhole')  collectBlackhole(it);
        else if (it.type === 'whitehole')  collectWhitehole(it);
        else if (it.type === 'antigrav') {
          if (!it._counted) {
            it._counted = true;
            antigravUsed++;
            spawnAntigravSparkle(it.x, it.y, it.radius);
          }
        }
      }
    }

    if (player.y + player.radius >= GROUND_Y) {
      player.y = GROUND_Y - player.radius;
      if (Math.abs(player.vy) > 1.5) {
        player.vy = -player.vy * 0.55;
        player.vx *= 0.85;
        player.spin *= 0.7;
        player.bounces++;
        spawnDust(player.x, GROUND_Y, lowQuality ? 5 : 10);
      } else {
        player.vy = 0;
        player.vx *= 0.96;
        player.spin *= 0.9;
        player.y = GROUND_Y - player.radius;
        if (Math.abs(player.vx) < 0.3) {
          player.vx = 0;
          player.settled = true;
        }
      }
      if (player.bounces > 0) player.angle *= 0.92;
    }

    // ============================================================
    //   鏡頭跟隨（平滑版）
    // ============================================================
    const speedX = Math.abs(player.vx);
    const lookAhead = Math.min(speedX * 12, W * 0.22);
    const baseScreenX = W * 0.35;
    const targetX = Math.max(0, player.x - (baseScreenX + lookAhead));

    const lerpX = speedX > 18 ? 0.14
                : speedX > 10 ? 0.10
                : speedX > 4  ? 0.07
                :               0.05;
    camera.x += (targetX - camera.x) * lerpX;

    const desiredPlayerScreenY = H * 0.55;
    const speedY = Math.abs(player.vy);
    const vertLead = Math.min(speedY * 6, H * 0.18);
    const targetY = player.y - desiredPlayerScreenY + (player.vy > 0 ? vertLead : -vertLead * 0.5);
    const clampedTargetY = Math.min(0, targetY);

    const lerpY = speedY > 15 ? 0.14
                : speedY > 8  ? 0.10
                :               0.06;
    camera.y += (clampedTargetY - camera.y) * lerpY;

    if (player.settled && Math.abs(player.vx) < 0.3) {
      state = 'landed';
      landingX = player.x;
      score = Math.round(Math.max(0, landingX - slingshot.x) * METER_SCALE);
      best = Math.max(best, score);
      const n = lowQuality ? 12 : 25;
      for (let i = 0; i < n; i++) {
        tryPushParticle({
          x: player.x, y: GROUND_Y,
          vx: (Math.random() - 0.5) * 6,
          vy: -Math.random() * 5,
          life: 50,
          size: 3,
          color: `hsla(${260 + Math.random()*60}, 80%, 70%, 0.9)`
        });
      }
    }

    trail.forEach(t => t.life--);
    trail = trail.filter(t => t.life > 0);
  }

  mines.forEach(m => {
    if (!m.exploded) {
      m.wobble += 0.03;
      m.blink += 0.1;
    }
  });

  items.forEach(it => { it.phase += 0.05; });

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);

  stars.forEach(s => { s.twinkle += 0.05; });
}

function explodeMine(m) {
  m.exploded = true;
  minesHit++;
  player.vy = MINE_BLAST_UP;
  player.vx = Math.max(Math.abs(player.vx), 6) + MINE_BLAST_FORWARD;
  player.spin += (Math.random() - 0.5) * MINE_BLAST_SPIN * 2;
  spawnExplosion(m.x, GROUND_Y);
}

function collectUFO(it) {
  it.used = true;
  ufosUsed++;
  ufoTranslateTime = UFO_TRANSLATE_SECONDS;
  player.vy = 0;
  player.vx = UFO_TRANSLATE_SPEED;
  attachedUFO = { phase: 0 };
  spawnUFOBeam(it.x, it.y);
}
function collectJetpack(it) {
  it.used = true;
  jetpacksUsed++;
  jetpackBoostTime = JETPACK_BOOST_SECONDS;
  spawnRocketFlash(it.x, it.y);
}
function collectRocket(it) {
  it.used = true;
  rocketsUsed++;
  rocketBoostTime = ROCKET_BOOST_SECONDS;
  spawnRocketFlash(it.x, it.y);
}
function collectBlackhole(it) {
  it.used = true;
  blackholesUsed++;
  const bx = player.x, by = player.y;
  player.x += BLACKHOLE_FORWARD;
  spawnWarpEffect(bx, by, '#6a2cff', '#c8a8ff');
  spawnWarpEffect(player.x, player.y, '#6a2cff', '#c8a8ff');
}
function collectWhitehole(it) {
  it.used = true;
  whiteholesUsed++;
  const bx = player.x, by = player.y;
  player.y -= WHITEHOLE_UP;
  player.vy = Math.min(player.vy, -2);
  spawnWarpEffect(bx, by, '#ffffff', '#a0f0ff');
  spawnWarpEffect(player.x, player.y, '#ffffff', '#a0f0ff');
}

function spawnWarpEffect(x, y, c1, c2) {

    tryPushParticle({
      x: x + Math.cos(a) * r,
      y: y + Math.sin(a) * r,
      vx: Math.cos(a + Math.PI) * sp,
      vy: Math.sin(a + Math.PI) * sp,
      life: 25 + Math.random() * 20,
      size: 2 + Math.random() * 3,
      color: Math.random() < 0.5 ? c1 : c2
    });
  }

function spawnRocketFlash(x, y) {

  for (let i = 0; i < n2; i++) {

    });

}
function spawnUFOBeam(x, y) {

function screenY(worldY) {

// ============================================================

// ============================================================
function drawCharacter_default(ctx, r) {
  const g = ctx.createRadialGradient(-5, -5, 3, 0, 0, r);
  g.addColorStop(0, '#FFE066');
  g.addColorStop(1, '#E8B300');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#B8860B';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(-6, -4, 3, 0, Math.PI * 2);
  ctx.arc(6, -4, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 3, 6, 0.15, Math.PI - 0.15);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,120,0.5)';
  ctx.beginPath();
  ctx.arc(-11, 4, 4, 0, Math.PI * 2);
  ctx.arc(11, 4, 4, 0, Math.PI * 2);
  ctx.fill();
}

function drawCharacter_astronaut(ctx, r) {
  const shell = ctx.createRadialGradient(-r*0.35, -r*0.4, r*0.15, 0, 0, r);
  shell.addColorStop(0, '#ffffff');
  shell.addColorStop(0.55, '#e8eef5');
  shell.addColorStop(1, '#8fa8c0');
  ctx.fillStyle = shell;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#4a5f7a';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.strokeStyle = '#e8b300';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.86, Math.PI * 1.15, Math.PI * 1.85);
  ctx.stroke();
  ctx.save();
  const visorGrad = ctx.createLinearGradient(-r*0.2, -r*0.6, r*0.7, r*0.6);
  visorGrad.addColorStop(0, '#1a2f4a');
  visorGrad.addColorStop(0.5, '#0a1a2e');
  visorGrad.addColorStop(1, '#050d18');
  ctx.fillStyle = visorGrad;
  ctx.beginPath();
  ctx.ellipse(r * 0.28, 0, r * 0.72, r * 0.78, 0, -1.1, 1.1);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#c0d0e0';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.ellipse(r * 0.28, 0, r * 0.72, r * 0.78, 0, -0.9, -0.45);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(r * 0.28, 0, r * 0.72, r * 0.78, 0, -0.2, 0.1);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(180, 220, 255, 0.55)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(r * 0.28, 0, r * 0.72, r * 0.78, 0, 0.3, 0.55);
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.fillStyle = '#ff5c8a';
  setShadow('#ff5c8a', 12);
  ctx.beginPath();
  ctx.arc(0, -r * 0.95, 3, 0, Math.PI * 2);
  ctx.fill();
  clearShadow();
  ctx.strokeStyle = '#8fa8c0';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(0, -r * 0.9);
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.translate(-r * 0.55, r * 0.45);
  ctx.fillStyle = '#2a3a52';
  ctx.beginPath();
  ctx.roundRect(-7, -5, 14, 10, 2);
  ctx.fill();
  ctx.strokeStyle = '#6a8aa8';
  ctx.lineWidth = 1;
  ctx.stroke();
  const t = performance.now() / 400;
  ctx.fillStyle = `hsl(${(t * 60) % 360}, 90%, 65%)`;
  ctx.beginPath();
  ctx.arc(-3, 0, 1.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#7ee8fa';
  ctx.beginPath();
  ctx.arc(2, -1, 1.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffd93d';
  ctx.beginPath();
  ctx.arc(2, 2, 1.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawCharacter_banana(ctx, r) {
  ctx.save();
  ctx.rotate(-0.25);
  const outerRx = r * 1.15;
  const outerRy = r * 0.95;
  const curveOffset = r * 0.35;
  const bodyGrad = ctx.createLinearGradient(-r, -r * 0.6, r, r * 0.6);
  bodyGrad.addColorStop(0,    '#FFE55C');
  bodyGrad.addColorStop(0.35, '#FFD93D');
  bodyGrad.addColorStop(0.7,  '#F2B300');
  bodyGrad.addColorStop(1,    '#C89000');
  ctx.beginPath();
  ctx.moveTo(-outerRx * 0.95, -outerRy * 0.15);
  ctx.quadraticCurveTo(0, -outerRy * 1.05 + curveOffset, outerRx * 0.95, -outerRy * 0.15);
  ctx.quadraticCurveTo(0, outerRy * 0.95 + curveOffset, -outerRx * 0.95, -outerRy * 0.15);
  ctx.closePath();
  ctx.fillStyle = bodyGrad;
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-outerRx * 0.95, -outerRy * 0.15);
  ctx.quadraticCurveTo(0, outerRy * 0.95 + curveOffset, outerRx * 0.95, -outerRy * 0.15);
  ctx.lineWidth = r * 0.28;
  ctx.strokeStyle = 'rgba(140, 90, 0, 0.35)';
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(-outerRx * 0.95, -outerRy * 0.15);
  ctx.quadraticCurveTo(0, -outerRy * 1.05 + curveOffset, outerRx * 0.95, -outerRy * 0.15);
  ctx.quadraticCurveTo(0, outerRy * 0.95 + curveOffset, -outerRx * 0.95, -outerRy * 0.15);
  ctx.closePath();
  ctx.strokeStyle = '#8B6914';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-outerRx * 0.7, -outerRy * 0.3);
  ctx.quadraticCurveTo(0, -outerRy * 0.85 + curveOffset * 0.7, outerRx * 0.7, -outerRy * 0.3);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
  ctx.lineWidth = r * 0.1;
  ctx.lineCap = 'round';
  ctx.stroke();
  for (let i = 1; i <= 3; i++) {
    const t = i / 4;
    ctx.beginPath();
    ctx.moveTo(-outerRx * 0.75, -outerRy * 0.15 + t * r * 0.25);
    ctx.quadraticCurveTo(0, -outerRy * 0.95 + curveOffset + t * r * 0.3, outerRx * 0.75, -outerRy * 0.15 + t * r * 0.25);
    ctx.strokeStyle = 'rgba(200, 140, 40, 0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.save();
  ctx.translate(outerRx * 0.92, -outerRy * 0.15);
  ctx.rotate(0.2);
  ctx.fillStyle = '#6b4a1a';
  ctx.beginPath();
  ctx.roundRect(-3, -6, 6, 10, 3);
  ctx.fill();
  ctx.fillStyle = '#8a6224';
  ctx.beginPath();
  ctx.roundRect(-2, -7, 4, 4, 2);
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(-outerRx * 0.95, -outerRy * 0.15, r * 0.14, 0, Math.PI * 2);
  ctx.fillStyle = '#5a3a10';
  ctx.fill();
  ctx.fillStyle = '#2a1a05';
  ctx.beginPath();
  ctx.ellipse(-r * 0.35, -r * 0.05, r * 0.09, r * 0.13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse( r * 0.25, -r * 0.05, r * 0.09, r * 0.13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-r * 0.38, -r * 0.12, r * 0.03, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc( r * 0.22, -r * 0.12, r * 0.03, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-r * 0.05, r * 0.02, r * 0.22, 0.25, Math.PI - 0.25);
  ctx.strokeStyle = '#2a1a05';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255, 130, 130, 0.55)';
  ctx.beginPath();
  ctx.arc(-r * 0.55, r * 0.1, r * 0.09, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc( r * 0.45, r * 0.1, r * 0.09, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawCharacter(ctx, id, r, glow = true) {
  ctx.save();
  if (glow && QP.charShadow) {
    ctx.shadowColor = id === 'banana'
      ? 'rgba(255, 217, 61, 0.9)'
      : id === 'astronaut'
        ? 'rgba(120, 220, 255, 0.9)'
        : 'rgba(255, 200, 80, 0.8)';
    ctx.shadowBlur = lowQuality ? 12 : 25;
  }
  if (id === 'astronaut') drawCharacter_astronaut(ctx, r);
  else if (id === 'banana') drawCharacter_banana(ctx, r);
  else drawCharacter_default(ctx, r);
  ctx.restore();
}

// ============================================================
//   SCENE DRAW
// ============================================================
function drawSky() {
  ctx.fillStyle = getSkyGradient();
  ctx.fillRect(0, 0, W, H);

  if (lowQuality) return;

  const key1 = Math.round(camera.x * 0.05) + '_' + Math.round(camera.y * 0.05);
  if (neb1CacheKey !== key1) {
    neb1Cache = ctx.createRadialGradient(W*0.3 - camera.x*0.05, H*0.4 - camera.y*0.05, 20, W*0.3 - camera.x*0.05, H*0.4 - camera.y*0.05, 320);
    neb1Cache.addColorStop(0, 'rgba(120, 60, 200, 0.14)');
    neb1Cache.addColorStop(1, 'rgba(120, 60, 200, 0)');
    neb1CacheKey = key1;
  }
  ctx.fillStyle = neb1Cache;
  ctx.fillRect(0, 0, W, H);

  const key2 = Math.round(camera.x * 0.08) + '_' + Math.round(camera.y * 0.08);
  if (neb2CacheKey !== key2) {
    neb2Cache = ctx.createRadialGradient(W*0.75 - camera.x*0.08, H*0.55 - camera.y*0.08, 20, W*0.75 - camera.x*0.08, H*0.55 - camera.y*0.08, 380);
    neb2Cache.addColorStop(0, 'rgba(60, 120, 220, 0.12)');
    neb2Cache.addColorStop(1, 'rgba(60, 120, 220, 0)');
    neb2CacheKey = key2;
  }
  ctx.fillStyle = neb2Cache;
  ctx.fillRect(0, 0, W, H);
}

function drawStars() {
  stars.forEach(s => {
    const x = s.x - camera.x * s.depth * 0.6;
    const y = s.y - camera.y * s.depth * 0.6;
    const wrappedX = ((x % (W * 6)) + W * 6) % (W * 6);
    if (wrappedX > W + 10 || y < -10 || y > H + 10) return;
    const tw = lowQuality ? 0.85 : (0.6 + Math.sin(s.twinkle) * 0.4);
    ctx.globalAlpha = tw;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(wrappedX, y, s.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawPlanets() {
  planets.forEach(p => {
    const x = p.x - camera.x * 0.15;
    const y = p.y - camera.y * 0.15;
    if (x < -200 || x > W + 200 || y < -200 || y > H + 200) return;
    const g = ctx.createRadialGradient(x - p.r*0.3, y - p.r*0.3, p.r*0.1, x, y, p.r);
    g.addColorStop(0, p.c1);
    g.addColorStop(1, p.c2);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, p.r, 0, Math.PI * 2);
    ctx.fill();
    if (p.ring && !lowQuality) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.4);
      ctx.strokeStyle = p.c1;
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r * 1.7, p.r * 0.45, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  });
}

function drawDust() {
  dust.forEach(d => {
    const x = d.x - camera.x * 0.4 - flightFrames * d.speed * 0.3;
    const y = d.y - camera.y * 0.4;
    const wrappedX = ((x % (W * 6)) + W * 6) % (W * 6);
    if (wrappedX > W + 10 || y < -10 || y > H + 10) return;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.arc(wrappedX, y, d.s, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawHills() {
  if (hills.length === 0 || hillSpan <= 0) return;

  const parY = GROUND_Y + 40 - camera.y * 0.5;

  hills.forEach(h => {
    const rawX = h.x - camera.x * 0.5;
    const wrappedX = ((rawX % hillSpan) + hillSpan) % hillSpan;

    for (let k = -1; k <= 1; k++) {
      const x = wrappedX + k * hillSpan;
      if (x < -h.r * 2 || x > W + h.r * 2) continue;

      ctx.fillStyle = h.color;
      ctx.beginPath();
      ctx.arc(x, parY, h.r, Math.PI, 0);
      ctx.fill();
      if (!lowQuality) {
        ctx.strokeStyle = 'rgba(140, 180, 255, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(x, parY, h.r, Math.PI, 0);
        ctx.stroke();
      }
    }
  });
}

function drawGround() {
  const gy = screenY(GROUND_Y);
  ctx.fillStyle = '#15082a';
  ctx.fillRect(0, gy, W, 30);
  ctx.fillStyle = '#0a0417';
  ctx.fillRect(0, gy + 30, W, H - gy - 30);
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.8)';
  ctx.lineWidth = 2;
  setShadow('rgba(0, 240, 255, 0.9)', 12);
  ctx.beginPath();
  ctx.moveTo(0, gy);
  ctx.lineTo(W, gy);
  ctx.stroke();
  clearShadow();
  const offset = camera.x % 80;
  for (let x = -offset; x < W; x += 80) {
    const seed = Math.floor((x + camera.x) / 80);
    const rng = Math.abs(Math.sin(seed * 12.9898) * 43758.5453) % 1;
    const h = 6 + rng * 14;
    ctx.fillStyle = '#1e0d3a';
    ctx.beginPath();
    ctx.moveTo(x, gy);
    ctx.lineTo(x + 8, gy - h);
    ctx.lineTo(x + 16, gy);
    ctx.closePath();
    ctx.fill();
  }
}

function drawMines() {
  const gy = screenY(GROUND_Y);
  mines.forEach(m => {
    if (m.exploded) return;
    const x = m.x - camera.x;
    if (x < -50 || x > W + 50) return;
    const y = gy - MINE_RADIUS * 0.5;
    drawMine(x, y, m);
  });
}

function drawMine(x, y, m) {
  const wob = Math.sin(m.wobble) * 2;
  const pulse = 0.6 + Math.sin(m.blink) * 0.4;
  ctx.save();
  ctx.translate(x, y + wob);
  if (QP.itemShadow) {
    ctx.shadowColor = `rgba(255, 60, 60, ${pulse * 0.9})`;
    ctx.shadowBlur = lowQuality ? 8 : 18;
  }
  ctx.strokeStyle = '#2a2a3a';
  ctx.lineWidth = 3;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * MINE_RADIUS * 0.7, Math.sin(a) * MINE_RADIUS * 0.7);
    ctx.lineTo(Math.cos(a) * MINE_RADIUS * 1.3, Math.sin(a) * MINE_RADIUS * 1.3);
    ctx.stroke();
  }
  const g = ctx.createRadialGradient(-5, -5, 3, 0, 0, MINE_RADIUS);
  g.addColorStop(0, '#5a5a6a');
  g.addColorStop(1, '#1a1a2a');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, MINE_RADIUS, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#0a0a1a';
  ctx.lineWidth = 2;
  ctx.stroke();
  if (QP.itemShadow) {
    ctx.shadowBlur = lowQuality ? 6 : 12;
    ctx.shadowColor = '#ff3c3c';
  }
  ctx.fillStyle = `rgba(255, ${40 + pulse * 40}, ${40}, ${0.6 + pulse * 0.4})`;
  ctx.beginPath();
  ctx.arc(0, 0, 4 + pulse * 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  clearShadow();
}

function drawItems() {
  items.forEach(it => {
    if (it.used) return;
    const x = it.x - camera.x;
    const y = it.y - camera.y;
    const cull = it.type === 'antigrav' ? it.radius + 200 : 250;
    if (x < -cull || x > W + cull) return;
    if      (it.type === 'ufo')        drawUFO(x, y, it);
    else if (it.type === 'jetpack')    drawJetpack(x, y, it);
    else if (it.type === 'rocket')     drawRocket(x, y, it);
    else if (it.type === 'antigrav')   drawAntigravZone(x, y, it);
    else if (it.type === 'blackhole')  drawBlackhole(x, y, it);
    else if (it.type === 'whitehole')  drawWhitehole(x, y, it);
  });
}

function drawUFO(x, y, it) {
  const bob = Math.sin(it.phase) * 7;
  const spin = it.phase * 0.8;
  const yy = y + bob;
  ctx.save();
  ctx.translate(x, yy);
  ctx.scale(2.0, 2.0);
  if (QP.itemShadow) {
    ctx.shadowColor = 'rgba(100, 255, 220, 0.9)';
    ctx.shadowBlur = lowQuality ? 12 : 25;
  }
  const bodyG = ctx.createLinearGradient(0, -12, 0, 12);
  bodyG.addColorStop(0, '#a0f0ff');
  bodyG.addColorStop(1, '#2a8fa8');
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.ellipse(0, 0, 34, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  const domeG = ctx.createRadialGradient(-4, -10, 2, 0, -8, 14);
  domeG.addColorStop(0, '#ffffff');
  domeG.addColorStop(1, '#7ee8fa');
  ctx.fillStyle = domeG;
  ctx.beginPath();
  ctx.ellipse(0, -8, 14, 12, 0, Math.PI, 0);
  ctx.fill();
  for (let i = 0; i < 5; i++) {
    const a = spin + (i / 5) * Math.PI * 2;
    const lx = Math.cos(a) * 20;
    const ly = 4 + Math.sin(a) * 3;
    const blink = 0.5 + 0.5 * Math.sin(spin * 3 + i);
    ctx.fillStyle = `rgba(255, 220, 100, ${0.5 + blink * 0.5})`;
    ctx.beginPath();
    ctx.arc(lx, ly, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  if (!lowQuality) {
    const beam = ctx.createLinearGradient(0, 8, 0, 60);
    beam.addColorStop(0, 'rgba(126, 232, 250, 0.35)');
    beam.addColorStop(1, 'rgba(126, 232, 250, 0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(-14, 8);
    ctx.lineTo(14, 8);
    ctx.lineTo(28, 60);
    ctx.lineTo(-28, 60);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  clearShadow();
  ctx.fillStyle = '#7ee8fa';
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('TRANSLATE 5s', x, yy + 70);
}

function drawAttachedUFO() {
  const x = player.x - camera.x;
  const y = player.y - camera.y;
  const r = player.radius;
  const yy = y - r - 26;
  const bob = Math.sin(attachedUFO.phase * 2) * 3;
  const spin = attachedUFO.phase * 2.0;
  const finalY = yy + bob;
  ctx.save();
  ctx.translate(x, finalY);
  ctx.scale(1.1, 1.1);
  if (QP.itemShadow) {
    ctx.shadowColor = 'rgba(100, 255, 220, 0.9)';
    ctx.shadowBlur = lowQuality ? 10 : 20;
  }
  const bodyG = ctx.createLinearGradient(0, -12, 0, 12);
  bodyG.addColorStop(0, '#a0f0ff');
  bodyG.addColorStop(1, '#2a8fa8');
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.ellipse(0, 0, 34, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  const domeG = ctx.createRadialGradient(-4, -10, 2, 0, -8, 14);
  domeG.addColorStop(0, '#ffffff');
  domeG.addColorStop(1, '#7ee8fa');
  ctx.fillStyle = domeG;
  ctx.beginPath();
  ctx.ellipse(0, -8, 14, 12, 0, Math.PI, 0);
  ctx.fill();
  for (let i = 0; i < 5; i++) {
    const a = spin + (i / 5) * Math.PI * 2;
    const lx = Math.cos(a) * 20;
    const ly = 4 + Math.sin(a) * 3;
    const blink = 0.5 + 0.5 * Math.sin(spin * 3 + i);
    ctx.fillStyle = `rgba(255, 220, 100, ${0.5 + blink * 0.5})`;
    ctx.beginPath();
    ctx.arc(lx, ly, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  if (!lowQuality) {
    const beam = ctx.createLinearGradient(0, 8, 0, 30);
    beam.addColorStop(0, 'rgba(126, 232, 250, 0.4)');
    beam.addColorStop(1, 'rgba(126, 232, 250, 0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(-10, 8);
    ctx.lineTo(10, 8);
    ctx.lineTo(20, 30);
    ctx.lineTo(-20, 30);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  clearShadow();
}

function drawJetpack(x, y, it) {
  const bob = Math.sin(it.phase) * 6;
  const yy = y + bob;
  const pulse = 0.5 + 0.5 * Math.sin(it.phase * 6);
  ctx.save();
  ctx.translate(x, yy);
  ctx.scale(1.8, 1.8);
  if (QP.itemShadow) {
    ctx.shadowColor = 'rgba(255, 180, 80, 0.85)';
    ctx.shadowBlur = lowQuality ? 10 : 22;
  }
  const flameLen = 14 + Math.sin(it.phase * 9) * 4;
  [-7, 7].forEach(nx => {
    const flameG = ctx.createLinearGradient(0, 14, 0, 14 + flameLen);
    flameG.addColorStop(0, 'rgba(255, 245, 160, 0.95)');
    flameG.addColorStop(0.4, 'rgba(255, 160, 60, 0.9)');
    flameG.addColorStop(1, 'rgba(255, 40, 40, 0)');
    ctx.fillStyle = flameG;
    ctx.beginPath();
    ctx.moveTo(nx - 4, 14);
    ctx.lineTo(nx + 4, 14);
    ctx.lineTo(nx, 14 + flameLen);
    ctx.closePath();
    ctx.fill();
  });
  [-7, 7].forEach(nx => {
    ctx.fillStyle = '#4a4a5a';
    ctx.beginPath();
    ctx.moveTo(nx - 5, 10);
    ctx.lineTo(nx + 5, 10);
    ctx.lineTo(nx + 4, 15);
    ctx.lineTo(nx - 4, 15);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#2a2a3a';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = `rgba(255, 200, 100, ${0.4 + pulse * 0.4})`;
    ctx.beginPath();
    ctx.arc(nx, 12, 1.6, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.fillStyle = '#5a6270';
  ctx.strokeStyle = '#2a3040';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-11, 10);
  ctx.lineTo(-11, -8);
  ctx.quadraticCurveTo(-11, -16, 0, -16);
  ctx.quadraticCurveTo(11, -16, 11, -8);
  ctx.lineTo(11, 10);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  const panelG = ctx.createLinearGradient(-8, -12, 8, 8);
  panelG.addColorStop(0, '#c8d0dc');
  panelG.addColorStop(1, '#8a94a4');
  ctx.fillStyle = panelG;
  ctx.beginPath();
  ctx.moveTo(-7, 8);
  ctx.lineTo(-7, -7);
  ctx.quadraticCurveTo(-7, -12, 0, -12);
  ctx.quadraticCurveTo(7, -12, 7, -7);
  ctx.lineTo(7, 8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#4a5260';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#ff8c42';
  ctx.beginPath();
  ctx.roundRect(-8, -16, 16, 4, 2);
  ctx.fill();
  ctx.strokeStyle = '#a05018';
  ctx.lineWidth = 0.8;
  ctx.stroke();
  ctx.strokeStyle = '#2a2a3a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-4, -10);
  ctx.quadraticCurveTo(-8, -2, -4, 8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(4, -10);
  ctx.quadraticCurveTo(8, -2, 4, 8);
  ctx.stroke();
  ctx.save();
  if (QP.itemShadow) {
    ctx.shadowColor = '#ffd93d';
    ctx.shadowBlur = lowQuality ? 7 : 14;
  }
  ctx.fillStyle = `rgba(255, 220, 90, ${0.7 + pulse * 0.3})`;
  ctx.beginPath();
  ctx.arc(0, -3, 3 + pulse * 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#7ee8fa';
  if (QP.itemShadow) {
    ctx.shadowColor = '#7ee8fa';
    ctx.shadowBlur = lowQuality ? 5 : 10;
  }
  ctx.beginPath();
  ctx.arc(0, -19, 2, 0, Math.PI * 2);
  ctx.fill();
  clearShadow();
  ctx.restore();
  clearShadow();
  ctx.fillStyle = '#ffb84d';
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('JETPACK 5s', x, yy + 70);
}

function drawRocket(x, y, it) {
  const bob = Math.sin(it.phase) * 6;
  const yy = y + bob;
  ctx.save();
  ctx.translate(x, yy);
  ctx.scale(2.0, 2.0);
  if (QP.itemShadow) {
    ctx.shadowColor = 'rgba(255, 140, 60, 0.9)';
    ctx.shadowBlur = lowQuality ? 12 : 25;
  }
  const flameLen = 18 + Math.sin(it.phase * 8) * 5;
  const flameG = ctx.createLinearGradient(0, 12, 0, 12 + flameLen);
  flameG.addColorStop(0, 'rgba(255, 240, 140, 0.95)');
  flameG.addColorStop(0.5, 'rgba(255, 140, 40, 0.8)');
  flameG.addColorStop(1, 'rgba(255, 40, 40, 0)');
  ctx.fillStyle = flameG;
  ctx.beginPath();
  ctx.moveTo(-7, 12);
  ctx.lineTo(7, 12);
  ctx.lineTo(0, 12 + flameLen);
  ctx.closePath();
  ctx.fill();
  const bodyG = ctx.createLinearGradient(-10, 0, 10, 0);
  bodyG.addColorStop(0, '#dcdcdc');
  bodyG.addColorStop(0.5, '#ffffff');
  bodyG.addColorStop(1, '#a0a0a0');
  ctx.fillStyle = bodyG;
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.quadraticCurveTo(10, -10, 10, 6);
  ctx.lineTo(10, 12);
  ctx.lineTo(-10, 12);
  ctx.lineTo(-10, 6);
  ctx.quadraticCurveTo(-10, -10, 0, -22);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#4a4a5a';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = '#ff5c3c';
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.quadraticCurveTo(6, -14, 6, -8);
  ctx.lineTo(-6, -8);
  ctx.quadraticCurveTo(-6, -14, 0, -22);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ff5c3c';
  ctx.beginPath();
  ctx.moveTo(-10, 0);
  ctx.lineTo(-16, 14);
  ctx.lineTo(-10, 12);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(10, 0);
  ctx.lineTo(16, 14);
  ctx.lineTo(10, 12);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#7ee8fa';
  if (QP.itemShadow) {
    ctx.shadowBlur = lowQuality ? 5 : 10;
    ctx.shadowColor = '#7ee8fa';
  }
  ctx.beginPath();
  ctx.arc(0, -2, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  clearShadow();
  ctx.fillStyle = '#ff9c4a';
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('ROCKET 3s', x, yy + 70);
}

function drawAntigravZone(x, y, it) {
  const r = ANTIGRAV_RADIUS;
  const pulse = 0.5 + 0.5 * Math.sin(it.phase * 2);
  const pulse2 = 0.5 + 0.5 * Math.sin(it.phase * 2 + Math.PI);
  ctx.save();
  ctx.globalAlpha = 0.25 + pulse * 0.1;
  const grad = ctx.createRadialGradient(x, y, r * 0.1, x, y, r);
  grad.addColorStop(0, 'rgba(200, 160, 255, 0.5)');
  grad.addColorStop(0.6, 'rgba(140, 100, 255, 0.2)');
  grad.addColorStop(1, 'rgba(140, 100, 255, 0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(it.phase);
  ctx.strokeStyle = `rgba(200, 160, 255, ${0.5 + pulse * 0.4})`;
  ctx.lineWidth = 3;
  ctx.setLineDash([10, 14]);
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.9, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  ctx.strokeStyle = `rgba(255, 220, 255, ${0.3 + pulse2 * 0.3})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, r * 0.55, 0, Math.PI * 2);
  ctx.stroke();
  if (!lowQuality) {
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 + pulse * 0.15})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.25, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.save();
  ctx.translate(x, y);
  for (let i = 0; i < 8; i++) {
    const a = it.phase * 0.5 + (i / 8) * Math.PI * 2;
    const ax = Math.cos(a) * r * 0.7;
    const ay = Math.sin(a) * r * 0.7;
    ctx.strokeStyle = `rgba(200, 240, 255, ${0.35 + pulse * 0.4})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ax - 6, ay + 5);
    ctx.lineTo(ax, ay - 5);
    ctx.lineTo(ax + 6, ay + 5);
    ctx.stroke();
  }
  ctx.restore();
  if (QP.itemShadow) {
    ctx.shadowColor = 'rgba(200, 160, 255, 0.9)';
    ctx.shadowBlur = lowQuality ? 10 : 20;
  }
  ctx.fillStyle = `rgba(230, 200, 255, ${0.7 + pulse * 0.3})`;
  ctx.beginPath();
  ctx.arc(x, y, 8 + pulse * 3, 0, Math.PI * 2);
  ctx.fill();
  clearShadow();
  ctx.fillStyle = '#c8a8ff';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('ANTI-GRAV 60m', x, y - r - 12);
}

function drawBlackhole(x, y, it) {
  const r = 36;
  const spin = it.phase * 1.6;
  ctx.save();
  ctx.translate(x, y);
  if (!lowQuality) {
    const disk = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 2);
    disk.addColorStop(0, 'rgba(160, 80, 255, 0.5)');
    disk.addColorStop(0.4, 'rgba(120, 40, 200, 0.25)');
    disk.addColorStop(1, 'rgba(80, 0, 160, 0)');
    ctx.fillStyle = disk;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  if (!lowQuality) {
    for (let i = 0; i < 8; i++) {
      const a = spin + (i / 8) * Math.PI * 2;
      const rr = r * 1.6;
      const px = x + Math.cos(a) * rr;
      const py = y + Math.sin(a) * rr * 0.5;
      const alpha = 0.4 + 0.6 * Math.abs(Math.sin(spin * 2 + i));
      ctx.fillStyle = `rgba(200, 140, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(px, py, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(spin * 0.3);
    ctx.strokeStyle = 'rgba(180, 120, 255, 0.85)';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.15, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  const g = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, r);
  g.addColorStop(0, '#000');
  g.addColorStop(0.7, '#05000a');
  g.addColorStop(1, '#1a0033');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(220, 160, 255, 0.9)';
  ctx.lineWidth = 2;
  if (QP.itemShadow) {
    ctx.shadowColor = 'rgba(200, 120, 255, 0.9)';
    ctx.shadowBlur = lowQuality ? 10 : 20;
  }
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();
  clearShadow();
  ctx.fillStyle = '#c8a8ff';
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('BLACK HOLE  +' + BLACKHOLE_FORWARD_M + 'm', x, y - r * 1.9);
}

function drawWhitehole(x, y, it) {
  const r = 36;
  const spin = it.phase * 1.6;
  const pulse = 0.5 + 0.5 * Math.sin(it.phase * 3);
  if (!lowQuality) {
    ctx.save();
    ctx.translate(x, y);
    const halo = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 2.2);
    halo.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
    halo.addColorStop(0.4, 'rgba(160, 240, 255, 0.35)');
    halo.addColorStop(1, 'rgba(160, 240, 255, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  if (!lowQuality) {
    ctx.save();
    ctx.translate(x, y);
    for (let i = 0; i < 12; i++) {
      const a = spin * 0.5 + (i / 12) * Math.PI * 2;
      const inner = r * 1.15;
      const outer = r * (1.6 + 0.25 * Math.sin(spin * 2 + i));
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.35 + pulse * 0.4})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
      ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
      ctx.stroke();
    }
    ctx.restore();
    for (let i = 0; i < 8; i++) {
      const a = -spin + (i / 8) * Math.PI * 2;
      const rr = r * 1.5;
      const px = x + Math.cos(a) * rr;
      const py = y + Math.sin(a) * rr * 0.5;
      const alpha = 0.5 + 0.5 * Math.abs(Math.sin(spin * 2 + i));
      ctx.fillStyle = `rgba(200, 250, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(px, py, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-spin * 0.3);
    ctx.strokeStyle = 'rgba(200, 250, 255, 0.9)';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.15, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
  const g = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, r);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.6, '#d0f4ff');
  g.addColorStop(1, '#7ec8ff');
  ctx.fillStyle = g;
  if (QP.itemShadow) {
    ctx.shadowColor = '#a0f0ff';
    ctx.shadowBlur = lowQuality ? 15 : 30;
  }
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  clearShadow();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = '#a0f0ff';
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('WHITE HOLE  +' + WHITEHOLE_UP_M + 'm ↑', x, y - r * 1.9);
}

function drawSigns() {
  const gy = screenY(GROUND_Y);
  const camLeft = camera.x - 100;
  const camRight = camera.x + W + 100;
  const firstSign = Math.max(1, Math.floor(camLeft / SIGN_SPACING));
  const lastSign  = Math.floor(camRight / SIGN_SPACING);
  for (let i = firstSign; i <= lastSign; i++) {
    const worldX = slingshot.x + i * SIGN_SPACING;
    const x = worldX - camera.x;
    const labelMeters = i * SIGN_DISPLAY_METERS;
    const isMajor = labelMeters % 500 === 0;
    drawSign(x, gy, labelMeters, isMajor);
  }
}

function drawSign(x, gy, labelMeters, isMajor) {
  if (x < -70 || x > W + 70) return;
  const poleH = isMajor ? 75 : 45;
  const plateW = isMajor ? 92 : 62;
  const plateH = isMajor ? 36 : 26;
  const fontSize = isMajor ? 18 : 13;
  const color = isMajor ? '#FFD93D' : '#7ee8fa';
  ctx.strokeStyle = color;
  ctx.lineWidth = isMajor ? 3.5 : 2;
  if (QP.itemShadow) {
    ctx.shadowColor = isMajor ? 'rgba(255, 217, 61, 0.9)' : 'rgba(126, 232, 250, 0.9)';
    ctx.shadowBlur = isMajor ? (lowQuality ? 8 : 16) : (lowQuality ? 5 : 10);
  }
  ctx.beginPath();
  ctx.moveTo(x, gy);
  ctx.lineTo(x, gy - poleH);
  ctx.stroke();
  const plateX = x - plateW / 2;
  const plateY = gy - poleH - plateH;
  ctx.fillStyle = 'rgba(10, 20, 45, 0.9)';
  ctx.strokeStyle = color;
  ctx.lineWidth = isMajor ? 2.5 : 1.5;
  ctx.beginPath();
  ctx.roundRect(plateX, plateY, plateW, plateH, 6);
  ctx.fill();
  ctx.stroke();
  clearShadow();
  ctx.fillStyle = color;
  ctx.font = `bold ${fontSize}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(labelMeters + ' m', x, plateY + plateH / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}

// ============================================================
//   LAUNCHER DRAWINGS
// ============================================================
function drawLauncher() {
  const launcher = LAUNCHERS[selectedLauncher].id;
  const x = slingshot.x - camera.x;
  const y = slingshot.y - camera.y;
  const gy = screenY(GROUND_Y);

  if (launcher === 'slingshot') {
    drawSlingshotLauncher(x, y, gy);
  } else if (launcher === 'cannon') {
    drawCannonLauncher(x, gy);
  }
}

function drawSlingshotLauncher(x, y, gy) {
  if (QP.itemShadow) {
    ctx.shadowColor = 'rgba(0, 200, 255, 0.6)';
    ctx.shadowBlur = lowQuality ? 8 : 15;
  }
  ctx.strokeStyle = '#3a3a5a';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, gy);
  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - 14, y - 22);
  ctx.moveTo(x, y);
  ctx.lineTo(x + 14, y - 22);
  ctx.stroke();
  clearShadow();
  const dx = player.x - camera.x;
  const dy = player.y - camera.y;
  ctx.strokeStyle = 'rgba(0, 220, 255, 0.9)';
  ctx.lineWidth = 3;
  if (QP.itemShadow) {
    ctx.shadowColor = 'rgba(0, 220, 255, 1)';
    ctx.shadowBlur = lowQuality ? 5 : 10;
  }
  if (state === 'aiming') {
    const pulling = dragging && (Math.hypot(dragX - slingshot.x, dragY - slingshot.y) > 5);
    const px = pulling ? dx : x;
    const py = pulling ? dy : y;
    ctx.beginPath();
    ctx.moveTo(x - 14, y - 22);
    ctx.lineTo(px, py);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 14, y - 22);
    ctx.lineTo(px, py);
    ctx.stroke();
  }
  clearShadow();
}

function drawCannonLauncher(x, gy) {
  const pivotY = gy - 55;
  const rad = cannonAngleDeg * Math.PI / 180;

  ctx.fillStyle = '#2a2a3a';
  ctx.beginPath();
  ctx.moveTo(x - 42, gy - 5);
  ctx.lineTo(x + 42, gy - 5);
  ctx.lineTo(x + 36, gy - 18);
  ctx.lineTo(x - 36, gy - 18);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#1a1a2a';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.strokeStyle = '#4a4a6a';
  ctx.lineWidth = 1.5;
  for (let i = -30; i <= 30; i += 12) {
    ctx.beginPath();
    ctx.moveTo(x + i, gy - 7);
    ctx.lineTo(x + i, gy - 16);
    ctx.stroke();
  }

  [-24, 24].forEach(wx => {
    ctx.fillStyle = '#1a1a2a';
    ctx.beginPath();
    ctx.arc(x + wx, gy - 5, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3a3a5a';
    ctx.beginPath();
    ctx.arc(x + wx, gy - 5, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5a5a7a';
    ctx.beginPath();
    ctx.arc(x + wx, gy - 5, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2a2a3a';
    ctx.lineWidth = 1.5;
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
      ctx.beginPath();
      ctx.moveTo(x + wx + Math.cos(a) * 4, gy - 5 + Math.sin(a) * 4);
      ctx.lineTo(x + wx + Math.cos(a) * 9, gy - 5 + Math.sin(a) * 9);
      ctx.stroke();
    }
  });

  ctx.fillStyle = '#3a3a4a';
  ctx.beginPath();
  ctx.moveTo(x - 18, gy - 18);
  ctx.lineTo(x + 18, gy - 18);
  ctx.lineTo(x + 10, pivotY + 5);
  ctx.lineTo(x - 10, pivotY + 5);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#1a1a2a';
  ctx.lineWidth = 2;
  ctx.stroke();

  if (!lowQuality) {
    ctx.strokeStyle = `rgba(0, 220, 255, ${0.4 + Math.sin(performance.now() / 200) * 0.2})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - 6, gy - 20);
    ctx.lineTo(x - 4, pivotY + 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 6, gy - 20);
    ctx.lineTo(x + 4, pivotY + 8);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(x, pivotY);
  ctx.rotate(-rad);

  const barrelLen = 78;
  const barrelW = 24;

  const barrelGrad = ctx.createLinearGradient(0, -barrelW / 2, 0, barrelW / 2);
  barrelGrad.addColorStop(0, '#b0b0c0');
  barrelGrad.addColorStop(0.3, '#808090');
  barrelGrad.addColorStop(0.7, '#505060');
  barrelGrad.addColorStop(1, '#2a2a3a');
  ctx.fillStyle = barrelGrad;
  ctx.beginPath();
  ctx.roundRect(0, -barrelW / 2, barrelLen, barrelW, 6);
  ctx.fill();
  ctx.strokeStyle = '#1a1a2a';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#404050';
  ctx.beginPath();
  ctx.roundRect(barrelLen * 0.4, -barrelW / 2 - 2, 6, barrelW + 4, 3);
  ctx.fill();
  ctx.strokeStyle = '#1a1a2a';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = '#404050';
  ctx.beginPath();
  ctx.roundRect(barrelLen * 0.75, -barrelW / 2 - 2, 6, barrelW + 4, 3);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#1a1a2a';
  ctx.beginPath();
  ctx.arc(barrelLen, 0, barrelW / 2 + 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#404050';
  ctx.beginPath();
  ctx.arc(barrelLen, 0, barrelW / 2 - 1, 0, Math.PI * 2);
  ctx.fill();

  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 150);
  ctx.fillStyle = `rgba(0, 220, 255, ${0.4 + pulse * 0.5})`;
  if (QP.itemShadow) {
    ctx.shadowColor = 'rgba(0, 220, 255, 1)';
    ctx.shadowBlur = lowQuality ? 9 : 18;
  }
  ctx.beginPath();
  ctx.arc(barrelLen - 3, 0, 6 + pulse * 2, 0, Math.PI * 2);
  ctx.fill();
  clearShadow();

  ctx.restore();

  ctx.fillStyle = '#505060';
  ctx.beginPath();
  ctx.arc(x, pivotY, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1a1a2a';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#00dcff';
  if (QP.itemShadow) {
    ctx.shadowColor = '#00dcff';
    ctx.shadowBlur = lowQuality ? 5 : 10;
  }
  ctx.beginPath();
  ctx.arc(x, pivotY, 5, 0, Math.PI * 2);
  ctx.fill();
  clearShadow();

  ctx.fillStyle = '#7ee8fa';
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'center';
  if (QP.itemShadow) {
    ctx.shadowColor = 'rgba(126, 232, 250, 0.8)';
    ctx.shadowBlur = lowQuality ? 5 : 10;
  }
  ctx.fillText(Math.round(cannonAngleDeg) + '°', x, gy - 95);
  clearShadow();

  if (state === 'aiming') {
    const px = x + Math.cos(rad) * 72;
    const py = pivotY - Math.sin(rad) * 72;
    ctx.save();
    ctx.translate(px, py);
    ctx.scale(0.65, 0.65);
    drawCharacter(ctx, CHARACTERS[selectedCharacter].id, player.radius, true);
    ctx.restore();
  }
}

function drawSlingshot() {}

function drawTrail() {
  trail.forEach((t) => {
    const alpha = t.life / 45 * 0.7;
    const size = 3 + (t.life / 45) * 4;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#7ee8fa';
    if (QP.particleShadow) {
      ctx.shadowColor = '#7ee8fa';
      ctx.shadowBlur = lowQuality ? 5 : 12;
    }
    ctx.beginPath();
    ctx.arc(t.x - camera.x, t.y - camera.y, size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  clearShadow();
}

function drawPlayer() {
  const x = player.x - camera.x;
  const y = player.y - camera.y;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(player.angle);
  const id = CHARACTERS[selectedCharacter].id;
  drawCharacter(ctx, id, player.radius, true);
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.life / 40);
    ctx.fillStyle = p.color;
    if (QP.particleShadow) {
      ctx.shadowColor = p.color;
      ctx.shadowBlur = lowQuality ? 4 : 8;
    }
    ctx.beginPath();
    ctx.arc(p.x - camera.x, p.y - camera.y, p.size || 3, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  clearShadow();
}

function drawAimGuide() {
  if (state !== 'aiming' || !dragging) return;
  if (LAUNCHERS[selectedLauncher].id !== 'slingshot') return;

  const dx = slingshot.x - dragX;
  const dy = slingshot.y - dragY;
  const power = Math.hypot(dx, dy);
  if (power < 12) return;
  const speed = power * 0.28;
  const angle = Math.atan2(dy, dx);
  let px = slingshot.x;
  let py = slingshot.y;
  let vx = Math.cos(angle) * speed;
  let vy = Math.sin(angle) * speed;
  ctx.fillStyle = 'rgba(126, 232, 250, 0.9)';
  if (QP.particleShadow) {
    ctx.shadowColor = 'rgba(126, 232, 250, 0.9)';
    ctx.shadowBlur = lowQuality ? 4 : 8;
  }
  const step = lowQuality ? 4 : 3;
  const maxIter = lowQuality ? 60 : 100;
  for (let i = 0; i < maxIter; i++) {
    for (let s = 0; s < step; s++) {
      vy += GRAVITY;
      vx *= FRICTION;
      px += vx;
      py += vy;
    }
    if (py > GROUND_Y) break;
    const size = 4 - i * (4/maxIter);
    if (size < 1) break;
    ctx.globalAlpha = 1 - i / maxIter;
    ctx.beginPath();
    ctx.arc(px - camera.x, py - camera.y, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  clearShadow();
}

// ============================================================
//   CHARACTER SELECT SCREEN
// ============================================================
function drawLauncherThumbnail(ctx, type, cx, cy, scale) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  if (type === 'slingshot') {
    if (QP.itemShadow) {
      ctx.shadowColor = 'rgba(0, 200, 255, 0.8)';
      ctx.shadowBlur = lowQuality ? 8 : 15;
    }
    ctx.strokeStyle = '#3a3a5a';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 40);
    ctx.lineTo(0, -20);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(-14, -42);
    ctx.moveTo(0, -20);
    ctx.lineTo(14, -42);
    ctx.stroke();
    ctx.shadowBlur = lowQuality ? 5 : 10;
    ctx.strokeStyle = 'rgba(0, 220, 255, 0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-14, -42);
    ctx.lineTo(0, -10);
    ctx.lineTo(14, -42);
    ctx.stroke();
    ctx.fillStyle = '#7ee8fa';
    ctx.shadowColor = '#7ee8fa';
    ctx.shadowBlur = lowQuality ? 8 : 15;
    ctx.beginPath();
    ctx.arc(0, -10, 8, 0, Math.PI * 2);
    ctx.fill();
    clearShadow();
  } else if (type === 'cannon') {
    const rad = 45 * Math.PI / 180;
    if (QP.itemShadow) {
      ctx.shadowColor = 'rgba(0, 200, 255, 0.8)';
      ctx.shadowBlur = lowQuality ? 8 : 15;
    }
    ctx.fillStyle = '#2a2a3a';
    ctx.beginPath();
    ctx.moveTo(-30, 35);
    ctx.lineTo(30, 35);
    ctx.lineTo(24, 22);
    ctx.lineTo(-24, 22);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#1a1a2a';
    ctx.lineWidth = 2;
    ctx.stroke();
    [-16, 16].forEach(wx => {
      ctx.fillStyle = '#1a1a2a';
      ctx.beginPath();
      ctx.arc(wx, 35, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3a3a5a';
      ctx.beginPath();
      ctx.arc(wx, 35, 6, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.fillStyle = '#3a3a4a';
    ctx.beginPath();
    ctx.moveTo(-12, 22);
    ctx.lineTo(12, 22);
    ctx.lineTo(6, -5);
    ctx.lineTo(-6, -5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#1a1a2a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.save();
    ctx.translate(0, -5);
    ctx.rotate(-rad);
    const barrelLen = 48;
    const barrelW = 14;
    const barrelGrad = ctx.createLinearGradient(0, -barrelW/2, 0, barrelW/2);
    barrelGrad.addColorStop(0, '#b0b0c0');
    barrelGrad.addColorStop(0.5, '#707080');
    barrelGrad.addColorStop(1, '#2a2a3a');
    ctx.fillStyle = barrelGrad;
    ctx.beginPath();
    ctx.roundRect(0, -barrelW/2, barrelLen, barrelW, 4);
    ctx.fill();
    ctx.strokeStyle = '#1a1a2a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = 'rgba(0, 220, 255, 0.8)';
    ctx.shadowColor = '#00dcff';
    ctx.shadowBlur = lowQuality ? 8 : 15;
    ctx.beginPath();
    ctx.arc(barrelLen - 2, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#505060';
    ctx.beginPath();
    ctx.arc(0, -5, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a1a2a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#00dcff';
    ctx.shadowColor = '#00dcff';
    ctx.shadowBlur = lowQuality ? 5 : 10;
    ctx.beginPath();
    ctx.arc(0, -5, 3, 0, Math.PI * 2);
    ctx.fill();
    clearShadow();
  }
  ctx.restore();
  clearShadow();
}

function drawCharacterSelect() {
  ctx.fillStyle = 'rgba(5, 8, 25, 0.9)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.textAlign = 'center';
  if (QP.useShadow) {
    ctx.shadowColor = 'rgba(126, 232, 250, 0.9)';
    ctx.shadowBlur = 25;
  }
  ctx.fillStyle = '#7ee8fa';
  ctx.font = 'bold 32px Arial';
  ctx.fillText('CHOOSE YOUR LAUNCHER', W / 2, 50);
  ctx.font = 'bold 13px Arial';
  ctx.shadowBlur = QP.useShadow ? 10 : 0;
  ctx.fillStyle = '#a0c8ff';
  ctx.fillText('Pick a launcher, then pick a pilot', W / 2, 74);
  ctx.restore();

  ctx.save();
  ctx.fillStyle = '#c8a8ff';
  ctx.font = 'bold 12px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('LAUNCHER', W / 2, 102);
  ctx.restore();

  for (let i = 0; i < LAUNCHERS.length; i++) {
    const r = getLauncherCardRect(i);
    const hovered = hoverLauncherIndex === i;
    const selected = selectedLauncher === i;

    ctx.save();
    ctx.fillStyle = selected
      ? 'rgba(40, 90, 140, 0.95)'
      : (hovered ? 'rgba(30, 60, 110, 0.95)' : 'rgba(10, 20, 45, 0.85)');
    ctx.strokeStyle = selected ? '#7ee8fa' : (hovered ? '#7ee8fa' : 'rgba(126, 232, 250, 0.45)');
    ctx.lineWidth = selected ? 3 : (hovered ? 2.5 : 1.5);
    if ((selected || hovered) && QP.useShadow) {
      ctx.shadowColor = 'rgba(126, 232, 250, 0.9)';
      ctx.shadowBlur = 20;
    }
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, 12);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    const thumbX = r.x + r.w / 2;
    const thumbY = r.y + r.h / 2 - 12;
    drawLauncherThumbnail(ctx, LAUNCHERS[i].id, thumbX, thumbY, 0.95);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 15px Arial';
    ctx.fillStyle = selected ? '#7ee8fa' : '#fff';
    if (selected && QP.useShadow) {
      ctx.shadowColor = 'rgba(126, 232, 250, 0.8)';
      ctx.shadowBlur = 12;
    }
    ctx.fillText(LAUNCHERS[i].name, r.x + r.w / 2, r.y + r.h - 16);
    ctx.restore();

    if (selected) {
      ctx.save();
      ctx.fillStyle = '#7ee8fa';
      if (QP.useShadow) {
        ctx.shadowColor = '#7ee8fa';
        ctx.shadowBlur = 15;
      }
      ctx.beginPath();
      ctx.arc(r.x + r.w - 14, r.y + 14, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  ctx.save();
  ctx.fillStyle = '#c8a8ff';
  ctx.font = 'bold 12px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('PILOT', W / 2, 262);
  ctx.restore();

  for (let i = 0; i < CHARACTERS.length; i++) {
    const r = getCardRect(i);
    const hovered = hoverIndex === i;

    ctx.save();
    ctx.fillStyle = hovered ? 'rgba(30, 60, 110, 0.95)' : 'rgba(10, 20, 45, 0.85)';
    ctx.strokeStyle = hovered ? '#7ee8fa' : 'rgba(126, 232, 250, 0.45)';
    ctx.lineWidth = hovered ? 3 : 1.5;
    if (hovered && QP.useShadow) {
      ctx.shadowColor = 'rgba(126, 232, 250, 0.9)';
      ctx.shadowBlur = 25;
    }
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, 16);
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.translate(r.x + r.w / 2, r.y + r.h / 2 - 8);
    if (QP.useShadow) {
      const halo = ctx.createRadialGradient(0, 0, 5, 0, 0, 55);
      halo.addColorStop(0, 'rgba(126, 232, 250, 0.35)');
      halo.addColorStop(1, 'rgba(126, 232, 250, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(0, 0, 55, 0, Math.PI * 2);
      ctx.fill();
    }
    drawCharacter(ctx, CHARACTERS[i].id, 24, true);
    ctx.restore();

    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = hovered ? '#7ee8fa' : '#fff';
    ctx.font = 'bold 16px Arial';
    if (hovered && QP.useShadow) {
      ctx.shadowColor = 'rgba(126, 232, 250, 0.8)';
      ctx.shadowBlur = 12;
    }
    ctx.fillText(CHARACTERS[i].name, r.x + r.w / 2, r.y + r.h - 14);
    ctx.restore();
  }

  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8ba8c9';
  ctx.font = '11px Arial';
  ctx.fillText('Click a launcher to select it, then click a pilot to start.', W / 2, H - 10);
  ctx.restore();
}
